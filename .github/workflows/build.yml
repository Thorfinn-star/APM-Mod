name: Build APM Mod

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --stacktrace
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: APM-Mod-0.1.0
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
